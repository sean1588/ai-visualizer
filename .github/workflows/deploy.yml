name: deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "lambda/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "lambda/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  pulumi:
    name: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && '' || 'prod' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            lambda/package-lock.json
            infra/package-lock.json

      - name: Install + typecheck + build lambda
        working-directory: lambda
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Install + typecheck infra
        working-directory: infra
        run: |
          npm ci
          npm run typecheck

      - name: Pulumi
        id: pulumi
        uses: pulumi/actions@v5
        with:
          command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
          stack-name: prod
          work-dir: infra
          comment-on-pr: ${{ github.event_name == 'pull_request' }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-west-2
          DISTRIBUTION_ID: ${{ steps.pulumi.outputs.distributionId }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "No distributionId output; skipping invalidation."
          fi
